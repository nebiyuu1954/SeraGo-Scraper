# SeraGo — weekly archive of ended jobs + logs (Sunday night).
#
# Runs `manage.py archive_week` (--step sunday) on Sunday 20:45 UTC = 23:45
# Addis Ababa — right after the day's last scrape (20:30 UTC). It files every
# job past its deadline + 7-day grace window and the week's logs (Mon–Sun),
# uploads the two gzipped files to the Telegram bot, then deletes the jobs
# and the Mon–Sat log rows — keeping Sunday's logs in the database so you can
# inspect the day on Monday.
#
# If the upload fails: nothing is deleted, you get a Telegram warning, and
# the run shows red. Monday's cleanup workflow (archive_cleanup.yml, 15:00
# UTC = 18:00 Addis) clears Sunday's kept data — or retries this archive if
# this run failed. There is no nightly retry: if Monday's retry also fails,
# fix the issue and rerun via the "Run workflow" button.
#
# Secrets (same as scrape.yml — Settings → Secrets and variables → Actions):
#   DB_ENGINE, DB_NAME, DB_USER, DB_PASSWORD, DB_HOST, DB_PORT=5432 (Neon)
#   DJANGO_SECRET_KEY
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID  (the archive files are delivered here)
name: SeraGo weekly archive

on:
  schedule:
    - cron: "45 20 * * 0"      # Sunday 20:45 UTC = 23:45 Addis Ababa
  workflow_dispatch: {}       # manual "Run workflow" button (also the Monday-failure rerun)

concurrency:
  group: archive
  cancel-in-progress: true

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DB_ENGINE: ${{ secrets.DB_ENGINE }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DJANGO_DEBUG: "false"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply migrations
        run: python manage.py migrate

      - name: Archive ended jobs + logs (Sunday)
        run: python manage.py archive_week --step sunday
