# SeraGo — scheduled scraper via GitHub Actions.
#
# Runs `manage.py scrape_all` on GitHub's free runners and writes to the
# shared Neon PostgreSQL database.
#
# IMPORTANT — schedule on free plans:
#   * Works on PUBLIC repositories (unlimited runner minutes).
#   * Schedule events are effectively DISABLED on free PRIVATE repos — if
#     this repo is private, only the manual "Run workflow" button will work.
#
# Schedule (cron is in UTC; Addis Ababa = UTC+3):
#   Current:  0 9 * * *     = 09:00 UTC = 12:00  Addis time
#             30 20 * * *   = 20:30 UTC = 23:30  Addis time
#   FUTURE:   every 30 min → replace both entries with:  */30 * * * *
#   Note: GitHub disables scheduled workflows after 60 days with no repo
#   activity (any push resets the clock — normal development covers this).
#
# Secrets to add (repo Settings → Secrets and variables → Actions):
#   DB_ENGINE=django.db.backends.postgresql
#   DB_NAME, DB_USER, DB_PASSWORD, DB_HOST, DB_PORT=5432   (from Neon)
#   DJANGO_SECRET_KEY, ETHIOJOBS_TOKEN, JINA_API_KEY (optional)
#   SCRAPFLY_API_KEY, ZENROWS_API_KEY, SCRAPE_DO_API_KEY, SCRAPEBADGER_API_KEY,
#     SCRAPERAPI_KEY (all optional — anti-bot rotation backends for Cloudflare-
#     blocked sites; see CLOUDFLARE.md for the rotation strategy and credit math;
#     get free keys at scrapfly.io, zenrows.com, scrape.do, scrapebadger.com,
#     scraperapi.com)
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID  (optional — sends the report to
#     your Telegram after every run; see DEPLOYMENT.md §5b)
#
# Notification settings (repo Settings → Variables, or defaults):
#   NOTIFY_MODE      per-run (default) | daily  — daily = only failures +
#                    one end-of-day digest (for the every-30-min future)
#   DAILY_DIGEST_UTC 20:30 (default) — HH:MM UTC of the final run of the day
#                    (20:30 UTC = 23:30 Addis time)
name: SeraGo scheduled scrape

on:
  schedule:
    - cron: "0 9 * * *"      # 09:00 UTC = 12:00 Addis Ababa
    - cron: "30 20 * * *"    # 20:30 UTC = 23:30 Addis Ababa
  workflow_dispatch: {}       # manual "Run workflow" button

# Only one scrape run at a time: a manual "Run workflow" click while the
# scheduled run is in progress would double the API traffic and Neon load
# (and trigger the scraper's race-retry path). cancel-in-progress = the
# newer run wins and cancels the older one — exactly right for a scraper.
concurrency:
  group: scrape
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DB_ENGINE: ${{ secrets.DB_ENGINE }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DJANGO_DEBUG: "false"
      ETHIOJOBS_TOKEN: ${{ secrets.ETHIOJOBS_TOKEN }}
      JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
      SCRAPFLY_API_KEY: ${{ secrets.SCRAPFLY_API_KEY }}
      ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
      SCRAPE_DO_API_KEY: ${{ secrets.SCRAPE_DO_API_KEY }}
      SCRAPEBADGER_API_KEY: ${{ secrets.SCRAPEBADGER_API_KEY }}
      SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NOTIFY_MODE: ${{ vars.NOTIFY_MODE || 'per-run' }}
      DAILY_DIGEST_UTC: ${{ vars.DAILY_DIGEST_UTC || '20:30' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply migrations
        run: python manage.py migrate

      - name: Seed source configurations
        run: python manage.py seed_sources

      - name: Scrape all sources
        run: python manage.py scrape_all

      - name: Send Telegram report
        # Runs even when scrape_all fails (if: always()) so failures get
        # reported — that's the whole point of the notification.
        if: always()
        # Unbuffered output: on a pipe the command's stdout is block-buffered,
        # so a stalled step shows nothing in the log. PYTHONUNBUFFERED keeps
        # progress visible live.
        env:
          PYTHONUNBUFFERED: "1"
        run: python manage.py telegram_report
